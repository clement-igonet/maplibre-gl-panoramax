# maplibre-gl-panoramax — reference way to test and preview in containers
# (see RULES.md: run on the `ssh maplibre` VM, podman compose / docker compose).
#
#   podman compose run --rm test      # vitest suite in a Node container
#   podman compose run --rm smoke     # containerized Chromium loads the demo
#                                     # via the compose network (no host port);
#                                     # TARGET_URL overrides, e.g. the live
#                                     # Pages URL after a deploy
#
# PORT POLICY: panoramax has NO band in the VM platform table yet
# (debian:~/projects/platform/caddy/Caddyfile) — the web service binds no
# host port until one is assigned. Preview through the smoke service, an
# `ssh -L` to a compose-network port, or the live Pages URL.
services:
  test:
    image: docker.io/library/node:22-alpine
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules # container-local install; never clobbers the host's
    command: sh -c "npm install --no-audit --no-fund && npx vitest run"

  web:
    image: docker.io/library/caddy:2-alpine
    # No host port — see PORT POLICY above. Reached as http://web/ inside the
    # compose network (the smoke service does exactly that).
    volumes:
      - .:/srv:ro
    command: caddy file-server --root /srv --listen :80

  # Browser-level guard for the demo: a static file server can 200 every asset
  # while the ES-module graph is dead (one missing export kills the page) —
  # only a real browser catches that class of failure.
  smoke:
    build: tests/browser
    depends_on:
      - web
    environment:
      # pass-through: defaults to http://web/docs/ inside the script
      - TARGET_URL
