# maplibre-gl-panoramax — reference way to test and preview in containers
# (see RULES.md: run on the `ssh maplibre` VM, podman compose / docker compose).
#
#   podman compose run --rm test      # vitest suite in a Node container
#   podman compose run --rm smoke     # containerized Chromium loads the demo
#                                     # via the compose network (no host port);
#                                     # TARGET_URL overrides, e.g. the live
#                                     # Pages URL after a deploy
#
# PORT POLICY: panoramax = product digit 7 in the platform's 1PESI scheme
# (5 digits: 1 · product · env · service · instance — platform RULES.md §3,
# migration of platform PR #6): 17000 www, 17210/17220 green web/api (not
# yet built), 17300 staging, 17400 sandbox, 17500 dev preview. The legacy
# 85xx ports stay bound ALONGSIDE until the platform flips the edge routes
# and confirms decommission (both ranges are ours during the migration);
# 8501 was never ours (confinia squat). Never bind outside these ranges.
services:
  test:
    image: docker.io/library/node:22-alpine
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules # container-local install; never clobbers the host's
    command: sh -c "npm install --no-audit --no-fund && npx vitest run"

  web:
    image: docker.io/library/caddy:2-alpine
    # Dev preview on 17500 (also http://web/ inside the compose network,
    # which is how the smoke services reach it). Not edge-routed, so it
    # migrates directly — no 8504 legacy binding kept.
    ports:
      - "127.0.0.1:${WEB_PORT:-17500}:80"
    volumes:
      - .:/srv:ro
    command: caddy file-server --root /srv --listen :80

  # Confinia environments (see RULES.md § Deployment): static file-servers on
  # the band's public-facing ports; the platform edge routes
  # {www,staging,sandbox}.panoramax.confinia.io to them. All serve this
  # working tree (= main on the VM); sandbox may diverge for branch previews.
  www:
    image: docker.io/library/caddy:2-alpine
    ports:
      - "127.0.0.1:17000:80" # 1PESI
      - "127.0.0.1:8500:80" # legacy 85xx — serves the edge until the flip; drop at decommission
    volumes:
      - .:/srv:ro
    command: caddy file-server --root /srv --listen :80
    restart: unless-stopped

  staging:
    image: docker.io/library/caddy:2-alpine
    ports:
      - "127.0.0.1:17300:80" # 1PESI
      - "127.0.0.1:8502:80" # legacy 85xx — serves the edge until the flip; drop at decommission
    volumes:
      - .:/srv:ro
    command: caddy file-server --root /srv --listen :80
    restart: unless-stopped

  sandbox:
    image: docker.io/library/caddy:2-alpine
    ports:
      - "127.0.0.1:17400:80" # 1PESI
      - "127.0.0.1:8503:80" # legacy 85xx — serves the edge until the flip; drop at decommission
    volumes:
      - .:/srv:ro
    command: caddy file-server --root /srv --listen :80
    restart: unless-stopped

  # Browser-level guard for the demo: a static file server can 200 every asset
  # while the ES-module graph is dead (one missing export kills the page) —
  # only a real browser catches that class of failure.
  smoke:
    build: tests/browser
    depends_on:
      - web
    environment:
      # pass-through: defaults to http://web/docs/ inside the script
      - TARGET_URL
