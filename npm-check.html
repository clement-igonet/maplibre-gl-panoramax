<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>maplibre-gl-panoramax — npm consumption check</title>
    <link rel="icon" href="data:,">
    <!-- This page deliberately consumes the PUBLISHED npm package from the
         CDN — not ../src — so a broken publish (missing file, bad files list,
         broken import graph) fails HERE even when the repo demo works. The
         npm-smoke.mjs browser test asserts the #status line. -->
    <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.css">
    <style>
        body { margin: 0; font: 14px/1.4 system-ui, sans-serif; }
        #map { position: fixed; inset: 0 0 0 0; }
        #status {
            position: fixed; top: 10px; left: 10px; z-index: 2;
            background: rgba(0, 0, 0, .75); color: #fff;
            padding: 8px 12px; border-radius: 6px; max-width: 480px;
        }
    </style>
    <script type="importmap">
        {
            "imports": {
                "maplibre-gl": "https://esm.sh/maplibre-gl@5",
                "maplibre-gl-panoramax": "https://unpkg.com/maplibre-gl-panoramax/src/index.js"
            }
        }
    </script>
</head>
<body>
<div id="map"></div>
<div id="status">loading the npm package…</div>
<script type="module">
    const status = document.getElementById('status');
    try {
        const maplibregl = (await import('maplibre-gl')).default;
        const {addPanoramaxLayers, onPictureClick, getPicture, SEQUENCES_LAYER, PICTURES_LAYER} = await import('maplibre-gl-panoramax');
        const {version} = await (await fetch('https://unpkg.com/maplibre-gl-panoramax/package.json')).json();

        const map = new maplibregl.Map({
            container: 'map',
            style: {
                version: 8,
                sources: {osm: {type: 'raster', tiles: ['https://tile.openstreetmap.org/{z}/{x}/{y}.png'], tileSize: 256, attribution: '© OpenStreetMap contributors'}},
                layers: [{id: 'osm', type: 'raster', source: 'osm'}]
            },
            center: [2.3504, 48.855],
            zoom: 15
        });
        map.on('load', () => {
            addPanoramaxLayers(map);
            const ok = map.getLayer(SEQUENCES_LAYER) && map.getLayer(PICTURES_LAYER);
            status.textContent = ok
                ? `OK npm maplibre-gl-panoramax@${version} — coverage layers added`
                : `ERROR: layers missing after addPanoramaxLayers (npm @${version})`;
        });

        // Click a picture dot → metadata popup, straight from the npm API
        // client; "street view" deep-links into the full demo (?pic=).
        onPictureClick(map, async (id, feature) => {
            const anchor = feature.geometry.coordinates;
            const popup = new maplibregl.Popup({maxWidth: '260px'})
                .setLngLat(anchor)
                .setHTML('<em>loading picture…</em>')
                .addTo(map);
            try {
                const pic = await getPicture(id);
                popup.setHTML(`
                    <img src="${pic.assets.thumb || pic.assets.sd}" alt="" style="width:240px;border-radius:4px;display:block" />
                    <div style="margin-top:6px;font:12px/1.5 system-ui">
                        ${pic.type === 'equirectangular' ? '360°' : 'flat'} ·
                        ${(pic.datetime || '').slice(0, 10)} · ${pic.producer || ''}<br>
                        <a href="./index.html?pic=${encodeURIComponent(pic.id)}">Open in street view ↗</a>
                    </div>`);
            } catch (err) {
                popup.setHTML(`<em>ERROR: ${err.message || err}</em>`);
            }
        });
        map.on('error', (e) => {
            // Tile fetch hiccups are not package failures; only report style/layer errors.
            if (e?.error?.message && !/tile/i.test(e.error.message)) {
                status.textContent = `ERROR: ${e.error.message}`;
            }
        });
    } catch (err) {
        status.textContent = `ERROR: ${err.message || err}`;
    }
</script>
</body>
</html>
